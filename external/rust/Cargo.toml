[package]
name = "ra_fetch_gui"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
directories = "6.0.0"
eframe = { version = "0.36.2", features = ["persistence"] }
egui = "0.36.2"
flate2 = "1.1.10"
lzma-rs = "0.3.0"
md-5 = "0.11.0"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "rustls", "form", "charset"] }
rfd = "0.17.2"
ruzstd = "0.9.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[dev-dependencies]
zstd = "0.14.2"
